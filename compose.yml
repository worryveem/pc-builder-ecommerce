services:

  db:
    image: mysql:8.0
    container_name: fashionshop_db

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fashion_shop

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - fashionshop_network

  backend:
    build: .
    container_name: fashionshop_backend

    depends_on:
      - db

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/fashion_shop?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    networks:
      - fashionshop_network

volumes:
  mysql_data:

networks:
  fashionshop_network:
    driver: bridge