<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - KiddieLuxe Kids</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; padding: 0; 
            background: linear-gradient(135deg, #FFF0F3 0%, #FFF8EE 100%); 
            min-height: 100vh; 
            display: flex; flex-direction: column; 
            font-family: var(--font-body);
        }
        .main-wrapper {
            flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;
        }
        .split-container { 
            display: flex; width: 950px; max-width: 100%; min-height: 560px; 
            background: white; border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.06); 
            overflow: hidden; 
            border: 1px solid var(--border);
        }
        .split-left { 
            flex: 1; 
            background: url('images/hero_kids.png') center/cover no-repeat; 
            position: relative; display: none;
        }
        @media (min-width: 768px) { .split-left { display: block; } }
        .split-left::after { 
            content: ''; position: absolute; inset: 0; 
            background: linear-gradient(to top, rgba(26, 29, 46, 0.8), rgba(26, 29, 46, 0.2)); 
        }
        .split-quote { 
            position: absolute; bottom: 35px; left: 35px; color: white; right: 35px; z-index: 2; 
        }
        .split-quote h2 { font-size: 1.8rem; margin-bottom: 8px; color: white; font-family: var(--font-heading); }
        .split-quote p { font-size: 0.95rem; opacity: 0.9; line-height: 1.5; }

        .split-right { 
            flex: 1.1; padding: 3rem 3.5rem; display: flex; flex-direction: column; justify-content: center; 
        }
        .auth-logo { 
            font-size: 1.8rem; font-weight: 800; color: var(--text-main); 
            text-decoration: none; margin-bottom: 6px; text-align: center; 
            display: flex; align-items: center; justify-content: center; gap: 0.3rem;
        }
        .auth-logo span { color: var(--primary); }
        .auth-subtitle { text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
        
        .form-group { margin-bottom: 1.25rem; position: relative; }
        .form-label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; color: var(--text-main); }
        .form-input { 
            width: 100%; padding: 0.85rem 1.1rem; border: 1.5px solid var(--border); 
            border-radius: var(--radius-sm); font-family: inherit; font-size: 0.95rem; 
            background: #fff; transition: all 0.3s ease;
        }
        .form-input:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 101, 132, 0.15);
        }
        .auth-links { text-align: center; margin-top: 1.8rem; font-size: 0.95rem; color: var(--text-muted); }
        .auth-links a { font-weight: 700; color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

    <!-- Simple Top Nav for auth pages -->
    <nav style="padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="logo" style="margin:0;">
            <span class="logo-badge">KIDS</span>Kiddie<span>Luxe</span>
        </a>
        <a href="index.html" style="text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem;">
            &larr; Về trang chủ
        </a>
    </nav>

    <div class="main-wrapper">
        <div class="split-container">
            <div class="split-left">
                <div class="split-quote">
                    <h2>Nâng niu từng bước khôn lớn.</h2>
                    <p>Khám phá thế giới thời trang hữu cơ an lành, mang đến diện mạo tươi vui và tự tin mỗi ngày cho bé yêu.</p>
                </div>
            </div>
            
            <div class="split-right">
                <a href="index.html" class="auth-logo">
                    <span class="logo-badge">KIDS</span>Kiddie<span>Luxe</span>
                </a>
                <p class="auth-subtitle">Đăng nhập tài khoản phụ huynh</p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Tên đăng nhập</label>
                        <input type="text" name="username" id="username" class="form-input" placeholder="Nhập username của bạn..." required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mật khẩu</label>
                        <input type="password" name="password" id="password" class="form-input" placeholder="••••••••" required>
                    </div>
                    <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 0.95rem; font-size: 1.05rem; margin-top: 0.5rem;">
                        Đăng Nhập Ngay &rarr;
                    </button>
                </form>
                
                <div class="auth-links">
                    Chưa có tài khoản? <a href="register.html">Đăng ký thành viên mới</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat-widget.js"></script>
</body>
</html>
